name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Verify pinned package manager
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.25.0"
      - name: Install locked dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: corepack pnpm typecheck
      - name: Build and test
        run: corepack pnpm test
      - name: Audit production dependencies
        run: corepack pnpm audit --prod
