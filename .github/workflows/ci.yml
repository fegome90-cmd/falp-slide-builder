name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Verify pinned package manager
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.25.0"
      - name: Install locked dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint, format and architecture rules (Biome)
        run: corepack pnpm exec biome ci
      - name: Type check
        run: corepack pnpm typecheck
      - name: Build
        run: corepack pnpm build
      - name: Test (Vitest + targeted code coverage)
        run: corepack pnpm test:coverage
      - name: Install Chromium for browser tests
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Browser, component and accessibility QA
        run: corepack pnpm test:e2e
      - name: Upload browser QA screenshots and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: falp-slide-studio-visual-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Enable pinned package manager
        run: corepack enable
      - name: Audit production dependencies
        run: corepack pnpm audit --prod
